services:
  - type: web
    name: magalhaes-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Token para o backup automático (GET /api/admin/backup/auto, header x-backup-token).
      # Gerado automaticamente pelo Render; consulte o valor no painel do serviço.
      - key: BACKUP_TOKEN
        generateValue: true
