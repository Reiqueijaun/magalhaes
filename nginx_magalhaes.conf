# ─── ZONA DE RATE LIMITING (Anti-DDoS e Anti-Força-Bruta) ─────────────────────
# 10 req/s por IP para a API geral
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
# 3 req/min por IP para rotas de autenticação
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=3r/m;

# ─── BLOCO 1: Redireciona HTTP → HTTPS (Força Conexão Segura) ─────────────────
server {
    listen 80;
    server_name magalhaes.online www.magalhaes.online;

    # Bloqueia acesso a arquivos ocultos/sensíveis (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Redireciona todo tráfego HTTP para HTTPS com 301
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── BLOCO 2: Servidor HTTPS Seguro ───────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name magalhaes.online www.magalhaes.online;

    # ── Certificados SSL (Let's Encrypt / Certbot) ────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/magalhaes.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magalhaes.online/privkey.pem;

    # ── Protocolos e Cifras Seguras (TLS 1.2 e 1.3 apenas) ───────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Oculta Versão do Nginx ────────────────────────────────────────────────
    server_tokens off;

    # ── Raiz do Frontend (React SPA) ─────────────────────────────────────────
    root /var/www/magalhaes/frontend;
    index index.html;

    # ── Limites de Buffer e Corpo (Anti-DoS por payload gigante) ─────────────
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    client_max_body_size        12M;
    large_client_header_buffers 4 8k;

    # ── Timeouts (Anti-Slowloris) ─────────────────────────────────────────────
    client_body_timeout   12s;
    client_header_timeout 12s;
    keepalive_timeout     65s;
    send_timeout          10s;

    # ── Cabeçalhos de Segurança Globais ──────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Bloqueia Métodos HTTP Desnecessários ──────────────────────────────────
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # ── Bloqueia Arquivos Ocultos e Sensíveis ─────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(env|log|bak|sql|sh|conf|config|ini|pem|key|crt)$ {
        deny all;
        return 404;
    }
    location ~ ^/(\.git|\.github|node_modules|prisma|backend) {
        deny all;
        return 404;
    }

    # ── Rotas de Autenticação com Rate Limit mais estrito ────────────────────
    location ~* ^/api/auth/(login|reset) {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }

    # ── Proxy Geral da API com Rate Limit ─────────────────────────────────────
    location /api {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Frontend SPA (React) ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # Cache de assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }
    }

    # ── Bloqueia scanners e bots maliciosos ───────────────────────────────────
    location ~* (wp-admin|wp-login|phpmyadmin|adminer|\.php$) {
        return 444;
    }
}
